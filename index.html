.top-note-edit:hover{background:#fff;color:#111;border-color:#111;transform:translateY(-1px)}
.top-notice-heading .notice-rows-hint{font-size:10px;color:#fff;font-weight:800}
@media(max-width:640px){.top-notice-heading .notice-rows-hint{display:none}}
.panel.notice-layout{width:100%;max-width:700px;margin-inline:auto;padding:0;border:0;background:transparent;box-shadow:none}.notice-layout .notice-compose-panel{width:100%;min-width:0;margin:0 auto}.notice-layout .notice-compose-panel > .item{margin:0}.notice-layout .destination{margin-bottom:12px}.notice-layout .form-stack{min-width:0}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="brandmark">BKOP</div><div class="brandtext"><strong>BKOP</strong><span>Shared Workspace</span></div></div>
    <div class="demo-tools"><span class="save-state" id="saveState">Demo ready</span><button class="button danger" type="button" data-action="reset">Reset demo</button></div>
  </header>
  <section class="top-notice-board" id="topNotices" aria-live="polite" aria-label="Board notices"></section>
  <section class="stage" aria-label="BKOP workspace navigation">
    <div class="focus-space" id="focusSpace" aria-live="polite"></div>
    <nav class="spine" aria-label="Shared spaces">
      <h2 class="spine-title">Shared spaces</h2>
      <button class="module-link" type="button" data-view="noticeboard"><span class="module-icon">▤</span><span>Post a notice</span></button>
      <button class="module-link" type="button" data-view="conversations"><span class="module-icon">☷</span><span>Conversations</span></button>
      <button class="module-link" type="button" data-view="tasks"><span class="module-icon">✓</span><span>Tasks</span></button>
      <button class="module-link" type="button" data-view="files"><span class="module-icon">▰</span><span>Shared Files</span></button>
      <button class="module-link" type="button" data-view="calendar"><span class="module-icon">▦</span><span>Calendar</span></button>
      <button class="module-link" type="button" data-view="email"><span class="module-icon">✉</span><span>Email & drafts</span></button>
    </nav>
    <aside class="other-spaces" id="otherSpaces" aria-label="Other workspaces"></aside>
  </section>
  <div class="content-head"><div><h2 id="panelTitle">Noticeboard</h2><div class="context-line" id="contextLine">Bridge Kids International · Board</div></div><div class="toolbar"><span class="tag" id="viewTag">Demo data</span></div></div>
  <main class="panel" id="mainPanel" aria-live="polite"></main>
  <p class="footer-note">Sign in to sync records with approved BKOP members. Firebase Spark is no-cost; file contents stay on this device until Google Drive is connected.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  'use strict';
  const KEY='bkop-interactive-demo-v1';
  const ORGS={bki:'Bridge Kids International',ourplace:'Our Place @ Ben Washer Park',kizazi:'KIZAZI'};
  const ORG_MARKS={bki:'BK',ourplace:'OP',kizazi:'K'};
  const COMMITTEE_SPACES=['Committee 1','Committee 2','Committee 3','Committee 4','Committee 5','Committee 6'];
  const KNOWN_ALIASES=['OPBWP','Business','Kizazi Fund','BK Groups','Connect'];
  const MOCK_NOTICE_TEMPLATES=[
    {title:'Board meeting',body:'Add the date, agenda, and meeting link.'},
    {title:'Volunteer sign-up',body:'Add the shift date, time, and sign-up details.'},
    {title:'Committee update',body:'Share a reminder across BK, OP, and KZ.'}
  ];
  const FILES={};
  const SOCIAL_FILES={};
  const SOCIAL_URLS={};
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const id=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
  const stamp=()=>new Date().toISOString();
  function starter(){return {
    org:'bki',view:'noticeboard',rooms:{bki:'Board',ourplace:'Board',kizazi:'Board'},sharedRoom:'',
    committees:{bki:[],ourplace:[],kizazi:[]},
    notices:[
      {id:id(),org:'bki',title:'Board meeting',body:'Add the date, agenda, and meeting link.',pinned:true,mock:true,created:stamp()},
      {id:id(),org:'bki',title:'Volunteer sign-up',body:'Add the shift date, time, and sign-up details.',pinned:false,mock:true,created:stamp()},
      {id:id(),org:'bki',title:'Committee update',body:'Share a reminder across BK, OP, and KZ.',pinned:false,mock:true,created:stamp()},
      {id:id(),org:'ourplace',title:'Volunteer sign-up',body:'Add the shift date, time, and sign-up details.',pinned:true,mock:true,created:stamp()}
    ],
    messages:[
      {id:id(),org:'bki',room:'Board',by:'Board member',body:'Welcome to the BKOP demo. Try posting a message here.',created:stamp()},
      {id:id(),org:'ourplace',room:'Board',by:'Board member',body:'Use the organization circles to switch spaces.',created:stamp()},
      {id:id(),org:'shared',room:'Committee 1',by:'Committee demo',body:'This room stays the same when switching between BK, OP, and KZ.',created:stamp()}
    ],
    tasks:[
      {id:id(),org:'bki',room:'Board',title:'Review the next meeting agenda',assigned:'Board member',due:'',done:false,comments:[{by:'Board member',body:'Add any discussion items before the meeting.',created:stamp()}]},
      {id:id(),org:'kizazi',room:'Board',title:'Add a sample task',assigned:'',due:'',done:false,comments:[]},
      {id:id(),org:'shared',room:'Committee 1',title:'Try a cross-group committee task',assigned:'',due:'',done:false,comments:[]}
    ],
    files:[],events:[],aliases:KNOWN_ALIASES.slice(),inbox:'',members:[],socialDraft:'',socialMedia:[]
  };}
  function load(){try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);return Object.assign(starter(),x)}}catch(e){}return starter()}
  function normalizeState(candidate){
    const base=Object.assign(starter(),candidate||{});
    base.org=Object.prototype.hasOwnProperty.call(ORGS,base.org)?base.org:'bki';
    const views=['noticeboard','conversations','tasks','files','calendar','email','admin'];
    if(!views.includes(base.view))base.view='noticeboard';
    ['notices','messages','tasks','files','events','members','aliases','socialMedia'].forEach(k=>{if(!Array.isArray(base[k]))base[k]=[]});
    base.aliases=[...new Set([...KNOWN_ALIASES,...base.aliases])];
    base.rooms=Object.assign({bki:'Board',ourplace:'Board',kizazi:'Board'},base.rooms||{});
    base.committees=Object.assign({bki:[],ourplace:[],kizazi:[]},base.committees||{});
    base.sharedRoom=COMMITTEE_SPACES.includes(base.sharedRoom)?base.sharedRoom:'';
    return base;
  }
  let data=normalizeState(load());
  const CLOUD_KEYS=['notices','messages','tasks','files','events','aliases','inbox','members','socialDraft','socialMedia','checklist','committees'];
  function cloudPayload(){const out={};CLOUD_KEYS.forEach(k=>{out[k]=data[k]});return out}
  function parseFirebaseConfig(raw){
    const text=String(raw||''),start=text.indexOf('{'),end=text.lastIndexOf('}');
    if(start<0||end<=start)throw new Error('Paste the Firebase web app config object.');
    const jsonish=text.slice(start,end+1).replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}');
    const cfg=JSON.parse(jsonish);
    if(!cfg.apiKey||!cfg.authDomain||!cfg.projectId||!cfg.appId)throw new Error('The config needs apiKey, authDomain, projectId, and appId.');
    return cfg;
  }
  let recentlyPostedNoticeId=null;
  let lastNoticeAction='posted';
  let editingNoticeId=null;
  let editingNoticeDraft=null;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('#saveState').textContent='Saved on this device';if(window.BKOPFirebase)window.BKOPFirebase.save(cloudPayload()).catch(()=>{})}catch(e){$('#saveState').textContent='Save unavailable'}}
  function orgName(){return data.org==='admin'?'All organizations':ORGS[data.org]||ORGS.bki}
  function room(){return data.sharedRoom&&COMMITTEE_SPACES.includes(data.sharedRoom)?data.sharedRoom:(data.rooms[data.org]||'Board')}
  function rooms(){return ['Board',...COMMITTEE_SPACES,...(data.committees[data.org]||[])]}
  function roomScope(name){return COMMITTEE_SPACES.includes(name)?'shared':data.org}
  function optionsRooms(selected){return rooms().map(r=>`<option value="${esc(r)}" ${r===selected?'selected':''}>${esc(r)}</option>`).join('')}
  function fmt(d){if(!d)return '';const x=new Date(d);return isNaN(x)?'':x.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
  function panelHeader(title,desc){return `<div class="card"><h3>${title}</h3><p class="muted small" style="margin:0">${desc}</p></div>`}
  function safeHref(value){const raw=String(value||'').trim();if(!raw)return '';try{const url=new URL(raw);return url.protocol==='https:'||url.protocol==='http:'?url.href:''}catch(e){return ''}}
  function formatSize(bytes){return bytes<1024*1024?Math.max(1,Math.round(bytes/1024))+' KB':(bytes/1024/1024).toFixed(1)+' MB'}
  function addNoticeFiles(notice,files){
    notice.attachments=Array.isArray(notice.attachments)?notice.attachments:[];
    Array.from(files||[]).filter(file=>file&&file.name).forEach(file=>{
      const fid=id(),size=formatSize(file.size||0),kind=file.type||'File',created=stamp();
      FILES[fid]=file;
      notice.attachments.push({id:fid,name:file.name,type:file.type||'',size});
      data.files.unshift({id:fid,org:'central',name:file.name,kind,size,created,source:'notice',noticeId:notice.id});
    });
  }
  function renderNoticeResources(notice){
    const href=safeHref(notice.link),attachments=Array.isArray(notice.attachments)?notice.attachments:[];
    const linkMarkup=href?`<a class="notice-resource-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(notice.linkLabel||'Open link')} ↗</a>`:'';
    const filesMarkup=attachments.map(a=>FILES[a.id]?`<button class="notice-file-link" type="button" data-action="preview-file" data-id="${esc(a.id)}">📎 ${esc(a.name)}</button>`:`<span class="notice-file-missing">📎 ${esc(a.name)} · in shared files</span>`).join('');
    return linkMarkup||filesMarkup?`<div class="notice-resources">${linkMarkup}${filesMarkup}</div>`:'';
  }
  function pingAudienceLabel(value){
    if(value==='everyone')return 'EVERYONE';
    if(value==='board')return 'BOARD';
    const match=/^committee(\d)$/.exec(value||'');
    return match?'COMMITTEE '+match[1]:'';
  }
  function pingAudienceOptions(selected){
    const choices=[['none','No ping'],['everyone','Everyone'],['board',orgName()+' Board'],...COMMITTEE_SPACES.map((name,index)=>['committee'+(index+1),name])];
    return choices.map(([value,label])=>'<option value="'+esc(value)+'"'+(value===selected?' selected':'')+'>'+esc(label)+'</option>').join('');
  }
  function renderTopNotices(){
    const posted=data.notices.filter(n=>n.org===data.org).sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||(b.updated||b.created).localeCompare(a.updated||a.created));
    const cards=posted.slice();
    const fill=MOCK_NOTICE_TEMPLATES.filter(t=>!posted.some(n=>n.title.toLowerCase()===t.title.toLowerCase()));
    while(cards.length<3&&fill.length)cards.push({...fill.shift(),id:'mock-preview-'+cards.length,mock:true,pinned:false});
    const hint=posted.length>3?'<span class="notice-rows-hint">More notices below ↓</span>':'';
    const cardMarkup=cards.map(n=>{
      const label=n.id===recentlyPostedNoticeId?(lastNoticeAction==='edited'?'UPDATED':'JUST POSTED'):n.mock?'MOCK NOTICE':n.pinned?'PINNED':'POSTED';
      const href=safeHref(n.link),fileCount=(n.attachments||[]).length,ping=pingAudienceLabel(n.ping);
      return `<article class="top-note ${n.id===recentlyPostedNoticeId?'is-new':''}"><div class="top-note-meta"><span>${label}</span><span>${ping?'PING · '+ping:'BOARD'}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.body||'')}</p>${href?`<a class="top-note-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(n.linkLabel||'Open link')} ↗</a>`:''}${fileCount?`<span class="top-note-resource">📎 ${fileCount} file${fileCount===1?'':'s'} · Shared files</span>`:''}<div class="top-note-bottom"><button class="top-note-edit" type="button" aria-label="Edit notice: ${esc(n.title)}" title="Edit notice" data-action="edit-notice" data-id="${esc(n.id)}" data-title="${esc(n.title)}" data-body="${esc(n.body||'')}">Edit</button></div></article>`;
    }).join('');
    return `<div class="top-notice-heading"><strong>NOTICES</strong><span>${esc(orgName())} · Board</span>${hint}<span class="notice-swipe-hint">Swipe to see all →</span></div><div class="top-notice-cards" role="region" tabindex="0" aria-label="${esc(orgName())} notices; scroll to see more">${cardMarkup}</div>`;
  }
  function renderNoticeCard(n){
    return `<form class="item form-stack notice-editor" id="notice-${esc(n.id)}" data-form="notice-edit" data-id="${esc(n.id)}"><div class="field"><label>Notice title</label><input name="title" required maxlength="90" value="${esc(n.title)}"></div><div class="field"><label>Details</label><textarea name="body" maxlength="700">${esc(n.body||'')}</textarea></div><div class="field"><label>Link URL</label><input name="link" type="url" maxlength="500" value="${esc(n.link||'')}" placeholder="https://…"></div><div class="field"><label for="editNoticePing">Ping audience</label><select id="editNoticePing" name="ping">${pingAudienceOptions(n.ping||'none')}</select></div>${renderNoticeResources(n)}<div class="file-picker"><label for="editNoticeAttachments"><strong>Attach files</strong></label><input id="editNoticeAttachments" name="attachments" type="file" multiple></div><label class="check-row"><input name="pinned" type="checkbox" ${n.pinned?'checked':''}> Pin this notice</label><div class="platforms"><button class="mini primary" type="submit">Save changes</button><button class="mini" type="button" data-action="cancel-edit-notice">Cancel</button><button class="mini remove" type="button" data-action="delete-notice" data-id="${esc(n.id)}">Delete notice</button></div></form>`;
  }
  function renderNotices(){
    const editing=data.notices.find(n=>n.id===editingNoticeId&&n.org===data.org)||(editingNoticeDraft&&editingNoticeDraft.id===editingNoticeId?editingNoticeDraft:null);
    if(editing)return `<section class="notice-compose-panel">${renderNoticeCard(editing)}</section>`;
    return `<section class="notice-compose-panel"><div class="destination"><span class="destination-kicker">Posting to</span><strong>${esc(orgName())}</strong></div><form class="form-stack" data-form="notice"><div class="field"><label for="noticeTitle">Notice title</label><input id="noticeTitle" name="title" required maxlength="90" placeholder="e.g. Board meeting moved to Thursday"></div><div class="field"><label for="noticeBody">Details</label><textarea id="noticeBody" name="body" maxlength="700" placeholder="Add the information members need"></textarea></div><div class="field"><label for="noticeLink">Link URL (optional)</label><input id="noticeLink" name="link" type="url" maxlength="500" placeholder="https://…"></div><div class="field"><label for="noticePing">Ping audience</label><select id="noticePing" name="ping">${pingAudienceOptions('none')}</select></div><div class="file-picker"><label for="noticeAttachments"><strong>Attach files</strong></label><input id="noticeAttachments" name="attachments" type="file" multiple></div><label class="check-row"><input name="pinned" type="checkbox"> Pin this notice</label><button class="button primary" type="submit">Post to board</button></form></section>`;
  }
  function renderCommittees(){return `<section class="card committee-note"><h3>Shared committee spaces</h3><p class="small muted">Committee spaces 1–6 are shared across Bridge Kids, Our Place, and KIZAZI. Choose one above to share its conversation and tasks across all three.</p><div class="committee-pills">${COMMITTEE_SPACES.map(name=>`<span class="tag">${esc(name)}</span>`).join('')}</div></section>`}
  function renderConversations(){
    const r=room(),scope=roomScope(r),msgs=data.messages.filter(m=>m.room===r&&(scope==='shared'?(m.org==='shared'||Object.prototype.hasOwnProperty.call(ORGS,m.org)):m.org===scope)).sort((a,b)=>a.created.localeCompare(b.created));
    return `${panelHeader('Conversations','Board chat stays with its organization. Committee spaces 1–6 are shared across BK, OP, and KIZAZI.')}
    <div class="select-row"><label class="label" for="roomSelect">Conversation space</label><select id="roomSelect" data-change="room">${optionsRooms(r)}</select><span class="tag">${roomScope(r)==='shared'?'Cross-org · BK · OP · KZ':esc(orgName())}</span></div>
    ${renderCommittees()}<div class="chat-list">${msgs.length?msgs.map(m=>`<article class="message"><header><strong>${esc(m.by)}</strong><span>${fmt(m.created)}</span></header><p>${esc(m.body)}</p></article>`).join(''):'<div class="empty">No messages in this space yet.</div>'}</div>
    <form class="form-stack" data-form="message"><div class="field"><label for="messageBody">Write a message</label><textarea id="messageBody" name="body" required maxlength="1000" placeholder="Send a message to ${esc(r)}"></textarea></div><button class="button primary" type="submit">Send demo message</button></form>`;
  }
  function renderTasks(){
    const r=room(),scope=roomScope(r),items=data.tasks.filter(t=>t.room===r&&(scope==='shared'?(t.org==='shared'||Object.prototype.hasOwnProperty.call(ORGS,t.org)):t.org===scope)).sort((a,b)=>Number(a.done)-Number(b.done)||b.id.localeCompare(a.id));
    return `${panelHeader('Tasks with conversation threads','Board tasks stay with their organization. Committee 1–6 tasks are shared across BK, OP, and KIZAZI.')}
    <div class="select-row"><label class="label" for="taskRoom">Task space</label><select id="taskRoom" data-change="room">${optionsRooms(r)}</select><span class="tag">${roomScope(r)==='shared'?'Cross-org · BK · OP · KZ':esc(orgName())}</span></div>
    ${renderCommittees()}<form class="card form-stack" data-form="task" style="margin-top:12px"><div class="field"><label>Task</label><input name="title" required maxlength="120" placeholder="What needs to get done?"></div><div class="form-row"><div class="field"><label>Assigned to</label><input name="assigned" maxlength="60" placeholder="Name (optional)"></div><div class="field"><label>Due date</label><input name="due" type="date"></div></div><button class="button primary" type="submit">Add task</button></form>
    <div class="item-list">${items.length?items.map(t=>`<article class="item task ${t.done?'done':''}"><div class="item-top"><div class="task-title"><input aria-label="Mark ${esc(t.title)} complete" type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''}><div><h3>${esc(t.title)}</h3><div class="item-meta"><span>${t.assigned?'Assigned: '+esc(t.assigned):'Unassigned'}</span>${t.due?`<span>Due ${esc(t.due)}</span>`:''}<span>${esc(t.room)}</span></div></div></div><button class="mini remove" data-action="delete-task" data-id="${t.id}">Delete</button></div><details><summary>Conversation · ${(t.comments||[]).length} comment${(t.comments||[]).length===1?'':'s'}</summary>${(t.comments||[]).map(c=>`<div class="comment"><strong>${esc(c.by)}</strong> · ${fmt(c.created)}<br>${esc(c.body)}</div>`).join('')}<form class="form-stack" data-form="task-comment" data-id="${t.id}" style="margin-top:10px"><div class="field"><label>Add a comment</label><input name="body" required maxlength="500" placeholder="Keep task discussion here"></div><button class="mini" type="submit">Add comment</button></form></details></article>`).join(''):'<div class="empty">No tasks in this space. Add one above.</div>'}</div>`;
  }
  function renderFiles(){
    const items=data.files.filter(f=>f.org==='central'||f.org===data.org).sort((a,b)=>b.created.localeCompare(a.created));return `${panelHeader('Shared files','One central library for BK, OP, and KZ. Notice attachments appear here automatically.')}
    <div class="file-scope"><label class="label" for="fileScope">Save new files to</label><select id="fileScope"><option value="central">Central shared files · BK · OP · KZ</option><option value="org">${esc(orgName())} only</option></select></div>
    <div class="file-picker"><strong>Choose documents, photos, or PDFs</strong><div class="small muted" style="margin-top:5px">The demo keeps selected files on this device; the live workspace will connect to the shared Google Drive folder.</div><input id="fileInput" type="file" multiple></div>
    <div class="item-list" style="margin-top:14px">${items.length?items.map(f=>`<article class="item"><div class="item-top"><div><strong class="file-name">${esc(f.name)}</strong><div class="item-meta"><span>${esc(f.kind||'File')}</span><span>${esc(f.size||'')}</span><span>${f.org==='central'?'Shared across BK · OP · KZ':esc(orgName())}</span><span>${fmt(f.created)}</span></div></div><div class="item-actions">${FILES[f.id]?`<button class="mini" type="button" data-action="preview-file" data-id="${esc(f.id)}">Preview</button>`:'<span class="tag">Name saved for demo</span>'}<button class="mini remove" type="button" data-action="delete-file" data-id="${esc(f.id)}">Remove</button></div></div></article>`).join(''):'<div class="empty">No files in this library yet.</div>'}</div>`;
  }
  function inThisWeek(dateStr){const d=new Date(dateStr+'T12:00:00'),now=new Date(),start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(start.getDate()+7);return d>=start&&d<end}
  function renderCalendar(){const items=data.events.filter(e=>e.org===data.org).sort((a,b)=>a.date.localeCompare(b.date));const show=calendarFilter==='week'?items.filter(e=>inThisWeek(e.date)):items;return `${panelHeader('Calendar','Add a demo event and filter to this week. Events are stored only in this browser.')}
    <div class="week-tabs"><button class="mini ${calendarFilter==='week'?'primary':''}" data-action="calendar-filter" data-value="week" aria-pressed="${calendarFilter==='week'}">This week</button><button class="mini ${calendarFilter==='all'?'primary':''}" data-action="calendar-filter" data-value="all" aria-pressed="${calendarFilter==='all'}">All upcoming</button></div>
    <div class="panel-grid"><form class="card form-stack" data-form="event"><div class="field"><label>Event</label><input name="title" required maxlength="100" placeholder="Meeting or activity"></div><div class="form-row"><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Time</label><input name="time" type="time"></div></div><div class="field"><label>Location or link</label><input name="where" maxlength="120" placeholder="Optional"></div><button class="button primary" type="submit">Add event</button></form>
    <div class="item-list">${show.length?show.map(e=>`<article class="item"><div class="item-top"><strong>${esc(e.title)}</strong><button class="mini remove" data-action="delete-event" data-id="${e.id}">Delete</button></div><div class="item-meta"><span>${new Date(e.date+'T12:00:00').toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}${e.time?' · '+esc(e.time):''}</span>${e.where?`<span>${esc(e.where)}</span>`:''}</div></article>`).join(''):'<div class="empty">No events in this view. Add one or choose All upcoming.</div>'}</div></div>`}
  let calendarFilter='all';
  function socialAttachmentMarkup(){
    const attached=Array.isArray(data.socialMedia)?data.socialMedia:[];
    if(!attached.length)return '<div class="empty">No photo or PDF attached yet.</div>';
    return attached.map(function(m){
      const file=SOCIAL_FILES[m.id];
      const isImage=/\.(jpe?g|png|gif|webp|heic)$/i.test(m.name)||String(m.type||'').startsWith('image/');
      const isPdf=/\.pdf$/i.test(m.name)||m.type==='application/pdf';
      const thumb=isImage&&SOCIAL_URLS[m.id]?'<img class="social-thumb" src="'+esc(SOCIAL_URLS[m.id])+'" alt="">':'<span class="social-thumb">'+(isPdf?'PDF':'FILE')+'</span>';
      return '<article class="social-attachment">'+thumb+'<div><div class="social-file-name">'+esc(m.name)+'</div><div class="social-file-meta">'+esc(m.size||'')+' · '+(file?'Ready to share':'Choose again to attach')+'</div></div><button class="mini remove" type="button" data-action="delete-social-file" data-id="'+esc(m.id)+'">Remove</button></article>';
    }).join('');
  }

    if(kind==='event'){data.events.push({id:id(),org:data.org,title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),where:f.get('where').trim()});commit();toast('Event added');return}
    if(kind==='alias'){const a=f.get('alias').trim();if(a&&!data.aliases.includes(a))data.aliases.push(a);commit();toast('Alias added to demo list');return}
    if(kind==='inbox'){data.inbox=f.get('inbox').trim();commit();toast('Inbox saved in demo');return}
    if(kind==='email-draft'){const params=new URLSearchParams({view:'cm',fs:'1',to:f.get('to')||'',su:f.get('subject')||'',body:f.get('body')||''});window.open('https://mail.google.com/mail/?'+params.toString(),'_blank','noopener');toast('Gmail draft opened; review before sending');return}
    if(kind==='social'){
      data.socialDraft=f.get('caption').trim();save();
      const action=e.submitter&&e.submitter.value;
      const selectedFiles=(data.socialMedia||[]).map(m=>SOCIAL_FILES[m.id]).filter(Boolean);
      if(action==='share'){
        if(!selectedFiles.length){toast('Choose an image or PDF first');return}
        try{
          if(typeof navigator.share==='function'&&typeof navigator.canShare==='function'&&navigator.canShare({files:selectedFiles})){
            await navigator.share({title:'BKOP social post',text:data.socialDraft,files:selectedFiles});
            toast('Choose a social app in the share sheet');
          }else toast('This browser cannot pass files. Open the social app and attach them there.');
        }catch(err){if(err.name!=='AbortError')toast('The device share sheet could not open')}
        return;
      }
      if(action==='copy'){try{await navigator.clipboard.writeText(data.socialDraft);toast('Caption copied')}catch(err){toast('Copy is unavailable here; select the caption text')}render();return}
      render();
      if(action==='facebook'){window.open('https://www.facebook.com/','_blank','noopener');if(selectedFiles.length)toast('Attach the selected photo or PDF in Facebook before posting')}
      if(action==='instagram'){window.open('https://www.instagram.com/','_blank','noopener');if(selectedFiles.length)toast('Attach the selected photo in Instagram before posting')}
      return;
    }
    if(kind==='member'){data.members.push({id:id(),name:f.get('name').trim(),email:f.get('email').trim(),org:f.get('org'),role:f.get('role')});commit();toast('Demo member added');return}
  });
  render();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
}());
</script>
<script type="module" src="./firebase-sync.js"></script>
</body>
